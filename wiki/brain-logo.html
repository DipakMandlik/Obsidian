<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Project Logo</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-glow: rgba(0, 242, 255, 0.4);
            --text-color: #e0e0e6;
            --font-display: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: var(--text-color);
            font-family: var(--font-display);
        }

        .logo-container {
            position: relative;
            width: 300px;
            height: 300px;
            filter: drop-shadow(0 0 30px var(--accent-glow));
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node {
            animation: pulse 4s ease-in-out infinite;
        }

        .node:nth-child(2n) { animation-delay: 1s; }
        .node:nth-child(3n) { animation-delay: 2s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .synthesis-path {
            stroke-dasharray: 100;
            animation: flow 10s linear infinite;
        }

        @keyframes flow {
            from { stroke-dashoffset: 200; }
            to { stroke-dashoffset: 0; }
        }

        .title {
            margin-top: 2rem;
            font-size: 2.5rem;
            letter-spacing: 0.5rem;
            font-weight: 300;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.2rem;
            opacity: 0.5;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Left Brain: Architectural Data Blocks -->
            <rect x="40" y="60" width="30" height="80" rx="2" fill="#2A2A32" />
            <rect x="75" y="50" width="20" height="100" rx="2" fill="#3E3E4D" />
            <rect x="60" y="80" width="40" height="40" rx="2" fill="#1E1E26" stroke="#00F2FF" stroke-width="0.5"/>
            
            <!-- Right Brain: Synthesis Nodes & Neural Path -->
            <path class="synthesis-path" d="M100 50C140 50 170 80 170 110C170 140 140 170 100 170" stroke="url(#glowGradient)" stroke-width="2" stroke-linecap="round"/>
            
            <!-- Floating Nodes -->
            <circle class="node" cx="130" cy="70" r="4" fill="#00F2FF" />
            <circle class="node" cx="160" cy="100" r="3" fill="#00F2FF" />
            <circle class="node" cx="145" cy="135" r="5" fill="#00F2FF" />
            <circle class="node" cx="115" cy="160" r="2" fill="#00F2FF" />
            
            <!-- Connections -->
            <line x1="130" y1="70" x2="160" y2="100" stroke="#00F2FF" stroke-width="0.5" opacity="0.3" />
            <line x1="160" y1="100" x2="145" y2="135" stroke="#00F2FF" stroke-width="0.5" opacity="0.3" />
            <line x1="145" y1="135" x2="115" y2="160" stroke="#00F2FF" stroke-width="0.5" opacity="0.3" />
            <line x1="95" y1="100" x2="130" y2="70" stroke="#00F2FF" stroke-width="0.5" stroke-dasharray="2 2" />

            <defs>
                <linearGradient id="glowGradient" x1="100" y1="50" x2="100" y2="170" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#00F2FF" />
                    <stop offset="1" stop-color="#00F2FF" stop-opacity="0" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <div class="title">Brain</div>
    <div class="subtitle">LLM Knowledge Synthesis</div>

</body>
</html>
